name: Apply Quick Create request boundary

on:
  pull_request:
    branches: [develop/v1.2]
    paths:
      - tools/apply_quick_create_request_boundary.py
      - .github/workflows/apply-quick-create-boundary.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/architecture-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/architecture-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and verify request boundary
        run: |
          python tools/apply_quick_create_request_boundary.py
          node --check src/interface/web/static/arline.js
          node --check src/interface/web/static/js/quick-create.js
          git diff --check
      - name: Commit request boundary
        run: |
          rm -f tools/apply_quick_create_request_boundary.py
          rm -f .github/workflows/apply-quick-create-boundary.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make Quick Create requests explicit"
          git push origin HEAD:fix/architecture-hardening
