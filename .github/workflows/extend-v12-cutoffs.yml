name: Extend v1.2 fork cutoffs

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/extend_v12_cutoffs.py
      - .github/workflows/extend-v12-cutoffs.yml

concurrency:
  group: arline-v12-alpha-mutator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cutoff semantics
        run: python tools/extend_v12_cutoffs.py
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Remove one-shot tooling
        run: |
          rm -f tools/extend_v12_cutoffs.py
          rm -f .github/workflows/extend-v12-cutoffs.yml
          rm -f tools/apply_v12_memory_foundation.py tools/finalize_v12_memory_foundation.py tools/verify_v12_alpha.py tools/polish_v12_spatial_ui.py tools/complete_v12_alpha.py
          rm -f .github/workflows/apply-v12-memory-foundation.yml .github/workflows/finalize-v12-memory-foundation.yml .github/workflows/verify-v12-alpha.yml .github/workflows/polish-v12-spatial-ui.yml .github/workflows/complete-v12-alpha.yml .github/workflows/export-v12-source.yml .github/workflows/apply-v1-1-hardening.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit cutoff-safe alpha
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: enforce branch and chat fork memory cutoffs'
          git push origin HEAD:develop/v1.2
