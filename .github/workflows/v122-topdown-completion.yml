name: v1.2.2 Top-Down Completion

on:
  push:
    branches: [develop/v1.2]
    paths:
      - '.github/v122_topdown_apply.py'
      - '.github/v122_topdown_hotfix.py'
      - '.github/workflows/v122-topdown-completion.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/v122_topdown_apply.py'
      - '.github/v122_topdown_hotfix.py'
      - '.github/workflows/v122-topdown-completion.yml'

permissions:
  contents: write

jobs:
  apply-validate-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply, validate, and publish result
        shell: bash
        run: |
          set +e
          LOG=/tmp/v122-topdown.log
          : > "$LOG"
          echo '=== HOTFIX ===' | tee -a "$LOG"
          python .github/v122_topdown_hotfix.py >>"$LOG" 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo '=== APPLY ===' | tee -a "$LOG"
            python .github/v122_topdown_apply.py >>"$LOG" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo '=== UV ===' | tee -a "$LOG"
            python -m pip install --disable-pip-version-check uv >>"$LOG" 2>&1 && \
            uv lock --check >>"$LOG" 2>&1 && \
            uv sync --frozen >>"$LOG" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo '=== TARGETED ===' | tee -a "$LOG"
            uv run python -m unittest tests.test_v122_continuity_foundation tests.test_v122_topdown_completion -v >>"$LOG" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo '=== FULL ===' | tee -a "$LOG"
            uv run python -m unittest discover -s tests -p 'test_*.py' >>"$LOG" 2>&1
            rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            echo '=== STATIC ===' | tee -a "$LOG"
            uv run python -m compileall -q src tests >>"$LOG" 2>&1 && \
            node --check src/interface/web/static/js/discovery-sheets.js >>"$LOG" 2>&1
            rc=$?
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$rc" -eq 0 ]; then
            rm -f .github/v122_topdown_apply.py .github/v122_topdown_hotfix.py .github/workflows/v122-topdown-completion.yml .github/v122-topdown-status.txt
            git add -A
            git commit -m 'feat: complete v1.2.2 narrative continuity top-down'
            git push origin HEAD:develop/v1.2
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo 'v1.2.2 top-down validation failed; inspect this job log.'
            tail -n 260 "$LOG"
            exit "$rc"
          fi

          {
            echo "exit_code=$rc"
            echo "commit=$GITHUB_SHA"
            echo
            tail -n 260 "$LOG"
          } > .github/v122-topdown-status.txt
          git reset
          git add .github/v122-topdown-status.txt
          git commit -m 'chore: report v1.2.2 top-down validation failure' || true
          git push origin HEAD:develop/v1.2 || true
          echo 'v1.2.2 top-down validation failed; status committed.'
          exit "$rc"
