name: v1.2.4 Top-down Completion

on:
  push:
    branches: [develop/v1.2]
    paths:
      - '.github/v124_topdown_apply.py'
      - '.github/v124_bootstrap_fix.py'
      - '.github/workflows/v124-topdown-completion.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/v124_topdown_apply.py'
      - '.github/v124_bootstrap_fix.py'
      - '.github/workflows/v124-topdown-completion.yml'

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v1.2.4 vertical slice
        run: |
          python .github/v124_bootstrap_fix.py
          python .github/v124_topdown_apply.py
      - uses: astral-sh/setup-uv@v6
      - name: Validate Python and source contracts
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen
          uv run python -m unittest tests.test_v122_continuity_foundation tests.test_v122_topdown_completion tests.test_v123_context_intelligence tests.test_v124_directives_deliberation -v
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
      - name: Publish clean v1.2.4 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          rm -f .github/v124_topdown_apply.py .github/v124_bootstrap_fix.py .github/workflows/v124-topdown-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files --cached 'node_modules/**' | grep -q .; then
            echo 'Refusing to publish tracked node_modules' >&2
            exit 1
          fi
          git commit -m 'feat: complete v1.2.4 directives references and deliberation'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
