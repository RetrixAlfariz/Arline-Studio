name: v1.2.3 Final Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v123-final-verify.yml'

permissions:
  contents: write

jobs:
  floating:
    name: Floating Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install floating dependencies
        run: python -m pip install -e .
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
          if git ls-files 'node_modules/**' | grep -q .; then exit 1; fi

  frozen:
    name: Frozen uv.lock Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
          if git ls-files 'node_modules/**' | grep -q .; then exit 1; fi

  cleanup:
    name: Remove verification workflow
    needs: [floating, frozen]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - name: Remove temporary verifier
        run: |
          rm -f .github/workflows/v123-final-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize v1.2.3 verification'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
