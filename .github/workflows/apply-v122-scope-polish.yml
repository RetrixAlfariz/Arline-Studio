name: Apply v1.2.2 scope polish

on:
  push:
    branches:
      - work/v122-topdown-completion

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v122-topdown-completion
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply scoped continuity polish
        env:
          PATCH_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          source = base64.b64decode(os.environ['PATCH_B64']).decode('utf-8')
          compile(source, '<v122-scope-patch>', 'exec')
          exec(compile(source, '<v122-scope-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Validate full repository
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
      - name: Remove temporary workflow and trigger
        run: |
          rm -f .github/workflows/apply-v122-scope-polish.yml
          rm -f .github/v122_scope_trigger
      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep v1.2.2 continuity lineage-scoped"
          git push origin HEAD:work/v122-topdown-completion
