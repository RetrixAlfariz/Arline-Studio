name: Apply Workspace Discovery event migration

on:
  pull_request:
    branches: [develop/v1.2]
    paths:
      - tools/apply_workspace_discovery_events.py
      - .github/workflows/apply-workspace-discovery-events.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/architecture-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/architecture-hardening
          fetch-depth: 0
      - name: Apply and compile
        run: |
          python tools/apply_workspace_discovery_events.py
          python -m compileall -q src
          git diff --check
      - name: Commit event migration
        run: |
          rm -f tools/apply_workspace_discovery_events.py
          rm -f .github/workflows/apply-workspace-discovery-events.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          git commit -m "refactor: move Provisional Workspace hooks to domain events"
          git push origin HEAD:fix/architecture-hardening
