name: Rebuild v1.2 memory foundation

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/rebuild_v12_memory_core.py
      - tools/rebuild_v12_memory_integration.py
      - .github/workflows/rebuild-v12-memory.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write deterministic memory core
        run: python tools/rebuild_v12_memory_core.py
      - name: Wire app, UI, schema, tests
        run: python tools/rebuild_v12_memory_integration.py
      - name: Refresh lockfile
        run: |
          python -m pip install --quiet uv
          uv lock
      - name: Install
        run: python -m pip install -e .
      - name: Run all Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Repository hygiene
        run: |
          ! find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.pyc' \) | grep .
          ! find . -type d -name __pycache__ | grep .
      - name: Commit verified implementation
        run: |
          git config user.name "Rafzan"
          git config user.email "86295808+RetrixAlfariz@users.noreply.github.com"
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement v1.2 narrative memory query engine"
          git push origin HEAD:develop/v1.2
