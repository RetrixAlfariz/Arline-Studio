name: v1.2.4 Semantic Directive Polish

on:
  push:
    branches: [develop/v1.2]
    paths:
      - '.github/v124_semantic_polish.py'
      - '.github/workflows/v124-semantic-polish.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/v124_semantic_polish.py'
      - '.github/workflows/v124-semantic-polish.yml'

permissions:
  contents: write

jobs:
  polish-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic polish
        run: python .github/v124_semantic_polish.py
      - name: Validate v1.2.4 and regressions
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen
          uv run python -m unittest tests.test_v124_directives_deliberation -v
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/arline.js
          node --check src/interface/web/static/js/commands.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
      - name: Publish clean semantic polish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v124_semantic_polish.py .github/workflows/v124-semantic-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete v1.2.4 directive semantics'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
