name: Apply v1.1 media gallery finalizer

on:
  push:
    branches:
      - fix/v1.1-settings-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-settings-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply media/gallery finalizer
        run: python tools/apply_v11_media_gallery.py

      - name: Install
        run: python -m pip install -e .

      - name: Regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/arline.js

      - name: Media/gallery invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('src/interface/web/app.py').read_text(encoding='utf-8')
          js = Path('src/interface/web/static/arline.js').read_text(encoding='utf-8')
          html = Path('src/interface/web/static/index.html').read_text(encoding='utf-8')
          foundation = Path('src/workspace/foundation.py').read_text(encoding='utf-8')
          assert 'CREATE TABLE IF NOT EXISTS resource_media' in foundation
          assert '@app.post("/api/media/{media_id}/describe")' in app
          assert '"canon_changed": False' in app
          assert 'data-library-view="gallery"' in html
          assert 'renderEntityMediaSheet' in js
          assert js.count('$$(\'[data-home-review]\',byId("homeView")).forEach') == 1
          print('V11_MEDIA_GALLERY_STATIC_PASS')
          PY

      - name: Remove generated and one-shot files
        run: |
          rm -rf src/arline_studio.egg-info
          rm -f tools/apply_v11_media_gallery.py
          rm -f .github/workflows/apply-v11-media-gallery.yml

      - name: Commit finalizer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'feat: add Library gallery and local visual references'
          git push origin HEAD:fix/v1.1-settings-stack
