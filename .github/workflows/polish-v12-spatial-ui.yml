name: Polish v1.2 spatial Library UI

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/polish_v12_spatial_ui.py
      - .github/workflows/polish-v12-spatial-ui.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply spatial UI polish
        run: python tools/polish_v12_spatial_ui.py
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Remove one-shot tooling
        run: |
          rm -f tools/polish_v12_spatial_ui.py
          rm -f .github/workflows/polish-v12-spatial-ui.yml
          rm -f tools/apply_v12_memory_foundation.py
          rm -f tools/finalize_v12_memory_foundation.py
          rm -f tools/verify_v12_alpha.py
          rm -f .github/workflows/apply-v12-memory-foundation.yml
          rm -f .github/workflows/finalize-v12-memory-foundation.yml
          rm -f .github/workflows/verify-v12-alpha.yml
          rm -f .github/workflows/export-v12-source.yml
          rm -f .github/workflows/apply-v1-1-hardening.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit linked Library UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add linked spatial Library workflow'
          git push origin HEAD:develop/v1.2
