name: Apply v1.1 final polish

on:
  push:
    branches:
      - release/v1.1-final-polish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1-final-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final v1.1 patch
        run: python tools/apply_v11_final.py
      - name: Install package
        run: python -m pip install -e .
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/arline.js
      - name: Static final-v1.1 invariants
        run: |
          test ! -e tools/apply_v11_final.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('src/interface/web/static/index.html').read_text(encoding='utf-8')
          js = Path('src/interface/web/static/arline.js').read_text(encoding='utf-8')
          app = Path('src/interface/web/app.py').read_text(encoding='utf-8')
          nav = html.split('<nav class="workspace-nav"',1)[1].split('</nav>',1)[0]
          assert 'Feedback Lab' not in nav
          assert 'id="contextStackCard"' not in html
          assert '/static/js/stream.js' in html
          assert '@app.post("/api/generate/stream")' in app
          names = re.findall(r'(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(', js)
          dup = sorted({name for name in names if names.count(name)>1})
          assert not dup, dup
          print('FINAL_V11_STATIC_PASS')
          PY
      - name: Keep generated metadata out of commit
        run: rm -rf src/arline_studio.egg-info
      - name: Commit final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/writer_system.txt \
            src/interface/web/static/index.html \
            src/interface/web/static/arline.css \
            src/interface/web/static/arline.js \
            src/interface/web/app.py \
            src/writer/__init__.py \
            src/inference/__init__.py \
            src/service/__init__.py \
            tests/test_v11_final_foundation.py \
            tools/apply_v11_final.py
          git diff --cached --stat
          git commit -m 'feat: finalize v1.1 UX streaming and quality foundation'
          git push origin HEAD:release/v1.1-final-polish
