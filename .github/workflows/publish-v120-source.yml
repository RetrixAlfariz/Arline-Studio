name: Publish verified v1.2.0 source

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - .github/workflows/publish-v120-source.yml

permissions:
  contents: write

concurrency:
  group: publish-v120-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce verified source tree
        run: |
          python tools/fix_complete_v120_anchor.py
          python -m py_compile tools/complete_v120_foundation.py
          python tools/complete_v120_foundation.py
          python tools/final_assertion_fix.py
          rm -f tools/final_assertion_fix.py
      - name: Refresh lockfile
        run: |
          python -m pip install --quiet uv
          uv lock
      - name: Install
        run: python -m pip install -e .
      - name: Full regression gate
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Verify source contract before workflow restore
        run: |
          test -f src/memory/web.py
          grep -q 'create_memory_router' src/interface/web/app.py
          grep -q '_augment_memory_context' src/interface/web/app.py
          grep -q 'gated_lane_results' src/memory/query.py
          grep -q 'version = "1.2.0a1"' pyproject.toml
          grep -q '\[memory\]' config/arline.toml
          test -f docs/V12_IMPLEMENTATION_STATUS.md
      - name: Prepare source-only commit
        run: |
          # A GITHUB_TOKEN may not modify workflow files. Restore that directory
          # exactly to HEAD; workflow cleanup + permanent CI update are applied
          # atomically afterward through the authenticated GitHub connector.
          git checkout HEAD -- .github/workflows
          rm -rf src/arline_studio.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -delete
      - name: Commit source
        run: |
          git config user.name "Rafzan"
          git config user.email "86295808+RetrixAlfariz@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete v1.2.0 evidence and retrieval foundation"
          git push origin HEAD:develop/v1.2
