name: v1.2.4 Final Verification

on:
  push:
    branches: [develop/v1.2]
    paths:
      - '.github/workflows/v124-final-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v124-final-verify.yml'

permissions:
  contents: write

jobs:
  floating:
    name: Floating Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e .
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q src tests
          node --check src/interface/web/static/arline.js
          node --check src/interface/web/static/js/commands.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
          if git ls-files 'node_modules/**' | grep -q .; then exit 1; fi

  frozen:
    name: Frozen uv.lock Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen environment
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/arline.js
          node --check src/interface/web/static/js/commands.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check
          if git ls-files 'node_modules/**' | grep -q .; then exit 1; fi

  browser:
    name: Chromium slash/reference smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and Chromium
        run: |
          uv lock --check
          uv sync --frozen
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare isolated config
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tomlkit
          root = Path.cwd()
          runtime = Path('/tmp/arline-v124-final')
          runtime.mkdir(parents=True, exist_ok=True)
          doc = tomlkit.parse((root / 'config/arline.toml').read_text(encoding='utf-8'))
          doc['lmstudio']['auto_load'] = False
          doc['lmstudio']['api_key'] = ''
          doc['writer']['system_prompt_file'] = (root / 'config/writer_system.txt').as_posix()
          doc['reasoning_runtime']['guard_prompt_file'] = (root / 'config/reasoning_guard.txt').as_posix()
          doc['history']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['history']['dataset_root'] = (runtime / 'datasets').as_posix()
          doc['workspace']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['artifacts']['output_root'] = (runtime / 'output').as_posix()
          doc['artifacts']['saved_root'] = (runtime / 'saved').as_posix()
          doc['ui']['host'] = '127.0.0.1'
          doc['ui']['port'] = 7860
          Path('/tmp/arline-v124-final.toml').write_text(tomlkit.dumps(doc), encoding='utf-8')
          PY
      - name: Start Studio
        run: |
          uv run python app.py --config /tmp/arline-v124-final.toml >/tmp/arline-v124-final.log 2>&1 &
          echo $! >/tmp/arline-v124-final.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/api/config >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/arline-v124-final.log
          exit 1
      - name: Exercise browser contracts
        env:
          ARLINE_BROWSER_URL: http://127.0.0.1:7860
        run: node tests/frontend/browser_smoke.mjs
      - name: Diagnostics
        if: always()
        run: |
          cat /tmp/arline-v124-final.log || true
          if [ -f /tmp/arline-v124-final.pid ]; then kill "$(cat /tmp/arline-v124-final.pid)" 2>/dev/null || true; fi

  cleanup:
    name: Remove verifier
    needs: [floating, frozen, browser]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/v124-final-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize v1.2.4 verification'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
