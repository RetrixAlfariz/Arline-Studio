name: Verify v1.2 alpha

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/verify_v12_alpha.py
      - .github/workflows/verify-v12-alpha.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and harden source
        run: python tools/verify_v12_alpha.py
      - name: Refresh lockfile
        run: |
          python -m pip install --quiet uv
          uv lock
      - name: Install package
        run: python -m pip install -e .
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Repository hygiene
        run: |
          ! find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.pyc' \) -print | grep .
      - name: Remove all one-shot workflows and scripts
        run: |
          rm -f tools/apply_v12_memory_foundation.py
          rm -f tools/finalize_v12_memory_foundation.py
          rm -f tools/verify_v12_alpha.py
          rm -f .github/workflows/apply-v12-memory-foundation.yml
          rm -f .github/workflows/finalize-v12-memory-foundation.yml
          rm -f .github/workflows/verify-v12-alpha.yml
          rm -f .github/workflows/export-v12-source.yml
          rm -f .github/workflows/apply-v1-1-hardening.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Commit verified alpha
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: deliver verified Arline v1.2 memory query alpha'
          git push origin HEAD:develop/v1.2
