name: Apply v1.2 memory foundation

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/apply_v12_memory_foundation.py
      - .github/workflows/apply-v12-memory-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply integration patch
        run: python tools/apply_v12_memory_foundation.py
      - name: Refresh lockfile
        run: |
          python -m pip install --quiet uv
          uv lock
      - name: Install
        run: python -m pip install -e .
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
      - name: Remove one-shot tooling
        run: |
          rm -f tools/apply_v12_memory_foundation.py
          rm -f .github/workflows/apply-v12-memory-foundation.yml
          rm -f .github/workflows/export-v12-source.yml
          rm -f .github/workflows/apply-v1-1-hardening.yml
      - name: Commit v1.2 alpha foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: implement Arline v1.2 memory query foundation'
          git push origin HEAD:develop/v1.2
