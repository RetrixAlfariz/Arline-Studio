name: Apply v1.2.2 top-down completion

on:
  push:
    branches:
      - work/v122-topdown-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/v122-topdown-completion
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and apply semantic migration
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a /tmp/v122.log
          from pathlib import Path
          import base64, zlib
          chunks = sorted(Path('.github/tools').glob('v122_payload_*.txt'))
          assert len(chunks) == 5, f'expected 5 payload chunks, found {len(chunks)}'
          payload = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          source = zlib.decompress(base64.b85decode(payload)).decode('utf-8')
          compile(source, '<v122-topdown-apply>', 'exec')
          exec(compile(source, '<v122-topdown-apply>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Refresh lockfile and install frozen environment
        run: |
          set -o pipefail
          { uv lock && uv sync --frozen; } 2>&1 | tee -a /tmp/v122.log
      - name: Full Python regression suite
        run: |
          set -o pipefail
          uv run python -m unittest discover -s tests -v 2>&1 | tee -a /tmp/v122.log
      - name: Compile Python
        run: |
          set -o pipefail
          uv run python -m compileall -q src tests 2>&1 | tee -a /tmp/v122.log
      - name: JavaScript and runtime checks
        run: |
          set -o pipefail
          {
            node --check src/interface/web/static/js/commands.js
            node --check src/interface/web/static/js/stream.js
            node --check src/interface/web/static/js/quick-create.js
            node --check src/interface/web/static/js/memory.js
            node --check src/interface/web/static/js/discovery-sheets.js
            node --check src/interface/web/static/arline.js
            node --check tests/frontend/browser_smoke.mjs
            node tests/frontend/memory_runtime_smoke.js
            git diff --check
          } 2>&1 | tee -a /tmp/v122.log
      - name: Remove temporary applicator payload
        run: |
          rm -f .github/tools/v122_payload_*.txt
          rm -f .github/workflows/apply-v122-topdown.yml
          rm -f .github/v122_failure.log
          rmdir .github/tools 2>/dev/null || true
          git diff --check
      - name: Commit validated v1.2.2 completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete v1.2.2 narrative continuity top-down"
          git push origin HEAD:work/v122-topdown-completion
      - name: Persist failure diagnostics
        if: failure()
        run: |
          cp /tmp/v122.log .github/v122_failure.log 2>/dev/null || echo 'validation failed before log capture' > .github/v122_failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/v122_failure.log
          git commit -m "ci: record v1.2.2 applicator failure" || true
          git push origin HEAD:work/v122-topdown-completion || true
