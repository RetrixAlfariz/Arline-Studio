name: CI

on:
  push:
    branches:
      - main
      - v1.1
      - "fix/**"
      - "feat/**"
      - "release/**"
      - "develop/**"
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap_v121:
    if: github.ref == 'refs/heads/develop/v1.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged v1.2.1 update once
        run: |
          if test -f src/narrative/rails.py; then
            echo 'v1.2.1 rails already present; bootstrap is a no-op.'
            exit 0
          fi
          cat tools/apply_next.part00 tools/apply_next.part01 tools/apply_next.part02 tools/apply_next.part03 tools/apply_next.part04 \
            | base64 -d | gzip -d > /tmp/apply_next.py
          python -m py_compile /tmp/apply_next.py
          python /tmp/apply_next.py
          git config user.name "Rafzan"
          git config user.email "86295808+RetrixAlfariz@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'Applicator produced no changes' >&2; exit 1; }
          git commit -m "feat: start v1.2.1 temporal memory and Character Rails"
          git push origin HEAD:develop/v1.2

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e .
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/memory_runtime_smoke.js
      - name: Memory runtime scope smoke
        run: node tests/frontend/memory_runtime_smoke.js
      - name: Repository hygiene
        run: |
          if git ls-files 'src/arline_studio.egg-info/**' | grep -q .; then
            echo 'Generated egg-info is tracked in the repository.' >&2
            exit 1
          fi
          test ! -e tools/apply_v11_hardening.py
          test ! -e tools/apply_v11_final.py
          test ! -e .github/workflows/apply-hardening.yml
          test ! -e .github/workflows/apply-v11-final.yml
          if find tools -maxdepth 1 -type f \( -iname '*v12*' -o -iname '*v1_2*' -o -iname '*v120*' \) | grep -q .; then
            echo 'Temporary v1.2 applicator/tooling is tracked in the repository.' >&2
            exit 1
          fi
          if find .github/workflows -maxdepth 1 -type f \( -iname '*v12*' -o -iname '*v1.2*' -o -iname '*v120*' \) | grep -q .; then
            echo 'Temporary v1.2 workflows are tracked in the repository.' >&2
            exit 1
          fi
