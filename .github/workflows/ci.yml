name: CI

on:
  push:
    branches:
      - main
      - v1.1
      - "fix/**"
      - "feat/**"
      - "release/**"
      - "develop/**"
  pull_request:

permissions:
  contents: read

jobs:
  floating:
    name: Floating dependencies · Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install floating compatible dependencies
        run: python -m pip install -e .
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/command-center.js
          node --check src/interface/web/static/js/core/events.js
          node --check src/interface/web/static/js/chat/scroll-controller.js
          node --check src/interface/web/static/js/chat/message-runtime.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/memory_runtime_smoke.js
          node --check tests/frontend/browser_smoke.mjs
      - name: Memory runtime scope smoke
        run: node tests/frontend/memory_runtime_smoke.js
      - name: Diff and repository hygiene
        run: |
          git diff --check
          if git ls-files 'node_modules/**' | grep -q .; then
            echo 'Generated node_modules is tracked in the repository.' >&2
            exit 1
          fi
          if git ls-files 'src/arline_studio.egg-info/**' | grep -q .; then
            echo 'Generated egg-info is tracked in the repository.' >&2
            exit 1
          fi
          test ! -e src/interface/web/static/js/compat.js
          test ! -e tools/apply_v11_hardening.py
          test ! -e tools/apply_v11_final.py
          test ! -e tools/apply_architecture_hardening.py
          test ! -e tools/apply_event_spine_polish.py
          test ! -e tools/apply_final_architecture_cleanup.py
          test ! -e tools/apply_quick_create_request_boundary.py
          test ! -e tools/apply_workspace_discovery_events.py
          test ! -e tools/apply_secret_persistence_hardening.py
          test ! -e scripts/apply_v125_scroll_rework.py
          test ! -e scripts/apply_physical_item_cache_isolation.py
          test ! -e .github/workflows/apply-hardening.yml
          test ! -e .github/workflows/apply-v11-final.yml
          test ! -e .github/workflows/apply-v1-1-hardening.yml
          test ! -e .github/workflows/apply-architecture-hardening.yml
          test ! -e .github/workflows/apply-event-spine-polish.yml
          test ! -e .github/workflows/apply-final-architecture-cleanup.yml
          test ! -e .github/workflows/apply-quick-create-boundary.yml
          test ! -e .github/workflows/apply-workspace-discovery-events.yml
          test ! -e .github/workflows/apply-secret-persistence-hardening.yml
          test ! -e .github/workflows/apply-scroll-rework.yml
          if [ -d tools ] && find tools -maxdepth 1 -type f \( -iname '*v12*' -o -iname '*v1_2*' -o -iname '*v120*' \) | grep -q .; then
            echo 'Temporary v1.2 applicator/tooling is tracked in the repository.' >&2
            exit 1
          fi
          if find .github/workflows -maxdepth 1 -type f \( -iname '*v12*' -o -iname '*v1.2*' -o -iname '*v120*' \) | grep -q .; then
            echo 'Temporary v1.2 workflows are tracked in the repository.' >&2
            exit 1
          fi

  frozen:
    name: Frozen uv.lock · Python 3.13
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify and install locked environment
        run: |
          uv lock --check
          uv sync --frozen
      - name: Python regression suite
        run: uv run python -m unittest discover -s tests -v
      - name: Compile Python
        run: uv run python -m compileall -q src tests
      - name: JavaScript/runtime smoke
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/command-center.js
          node --check src/interface/web/static/js/core/events.js
          node --check src/interface/web/static/js/chat/scroll-controller.js
          node --check src/interface/web/static/js/chat/message-runtime.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/browser_smoke.mjs
          node tests/frontend/memory_runtime_smoke.js
          git diff --check

  native:
    name: Native storage · Rust + Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Build abi3 native wheel
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --manifest-path crates/arline-native/Cargo.toml --out /tmp/arline-native-wheel
          python -m pip install /tmp/arline-native-wheel/*.whl
      - name: Native storage smoke
        env:
          ARLINE_STORAGE_BACKEND: rust
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import _arline_native
          from src.storage.backend import BlobStore

          assert _arline_native.storage_version() == "0.1.0"
          with TemporaryDirectory() as td:
              store = BlobStore(Path(td) / "objects", backend="rust")
              payload = b"native-ci-smoke"
              first = store.put_bytes(payload)
              second = store.put_bytes(payload)
              assert first.backend == "rust"
              assert first.digest == sha256(payload).hexdigest()
              assert first.path == second.path
              assert first.created is True
              assert second.created is False
              assert store.read_bytes(first.digest) == payload
          print("Arline native storage smoke: ok")
          PY

  browser:
    name: Chromium browser smoke
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/develop/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Arline and browser harness
        run: |
          uv sync --frozen
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare isolated browser config
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import tomlkit

          root = Path.cwd()
          runtime = Path('/tmp/arline-browser')
          runtime.mkdir(parents=True, exist_ok=True)
          doc = tomlkit.parse((root / 'config/arline.toml').read_text(encoding='utf-8'))
          doc['lmstudio']['auto_load'] = False
          doc['lmstudio']['api_key'] = ''
          doc['writer']['system_prompt_file'] = (root / 'config/writer_system.txt').as_posix()
          doc['reasoning_runtime']['guard_prompt_file'] = (root / 'config/reasoning_guard.txt').as_posix()
          doc['history']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['history']['dataset_root'] = (runtime / 'datasets').as_posix()
          doc['workspace']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['artifacts']['output_root'] = (runtime / 'output').as_posix()
          doc['artifacts']['saved_root'] = (runtime / 'saved').as_posix()
          doc['ui']['host'] = '127.0.0.1'
          doc['ui']['port'] = 7860
          Path('/tmp/arline-browser.toml').write_text(tomlkit.dumps(doc), encoding='utf-8')
          PY
      - name: Start isolated Studio
        run: |
          uv run python app.py --config /tmp/arline-browser.toml >/tmp/arline-browser.log 2>&1 &
          echo $! >/tmp/arline-browser.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7860/api/config >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/arline-browser.log
          exit 1
      - name: Exercise Chromium UI
        env:
          ARLINE_BROWSER_URL: http://127.0.0.1:7860
        run: node tests/frontend/browser_smoke.mjs
      - name: Browser diagnostics
        if: always()
        run: |
          cat /tmp/arline-browser.log || true
          if [ -f /tmp/arline-browser.pid ]; then
            kill "$(cat /tmp/arline-browser.pid)" 2>/dev/null || true
          fi
