name: Apply settings stack fix

on:
  push:
    branches:
      - fix/v1.1-settings-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-settings-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Settings stack fix
        run: python tools/apply_settings_stack_fix.py

      - name: Install
        run: python -m pip install -e .

      - name: Regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/arline.js

      - name: Settings layout invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('src/interface/web/static/index.html').read_text(encoding='utf-8')
          css = Path('src/interface/web/static/arline.css').read_text(encoding='utf-8')
          js = Path('src/interface/web/static/arline.js').read_text(encoding='utf-8')
          assert 'data-view-panel="data"' not in html
          assert 'data-inspector-panel="review"' in html
          assert 'id="feedbackQueue"' in html
          assert 'v1.1 settings stack hotfix' in css
          assert 'setView("data")' not in js
          print('SETTINGS_STACK_STATIC_PASS')
          PY

      - name: Remove generated and one-shot files
        run: |
          rm -rf src/arline_studio.egg-info
          rm -f tools/apply_settings_stack_fix.py
          rm -f .github/workflows/apply-settings-stack-fix.yml

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: stack Settings vertically and embed Feedback Lab'
          git push origin HEAD:fix/v1.1-settings-stack
