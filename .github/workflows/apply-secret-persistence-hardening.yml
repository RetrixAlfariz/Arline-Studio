name: Apply secret persistence hardening

on:
  pull_request:
    branches: [develop/v1.2]
    paths:
      - tools/apply_secret_persistence_hardening.py
      - .github/workflows/apply-secret-persistence-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/architecture-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/architecture-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and verify secret hardening
        run: |
          python tools/apply_secret_persistence_hardening.py
          python -m compileall -q src
          node --check src/interface/web/static/arline.js
          git diff --check
      - name: Commit secret hardening
        run: |
          rm -f tools/apply_secret_persistence_hardening.py
          rm -f .github/workflows/apply-secret-persistence-hardening.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          git commit -m "security: keep API keys out of portable config"
          git push origin HEAD:fix/architecture-hardening
