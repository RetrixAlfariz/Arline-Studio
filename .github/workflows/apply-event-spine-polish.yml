name: Apply event spine polish

on:
  pull_request:
    branches: [develop/v1.2]
    paths:
      - tools/apply_event_spine_polish.py
      - .github/workflows/apply-event-spine-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/architecture-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/architecture-hardening
          fetch-depth: 0
      - name: Apply and compile
        run: |
          python tools/apply_event_spine_polish.py
          python -m compileall -q src
          git diff --check
      - name: Commit polished event spine
        run: |
          rm -f tools/apply_event_spine_polish.py
          rm -f .github/workflows/apply-event-spine-polish.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          git commit -m "refactor: polish domain event integration"
          git push origin HEAD:fix/architecture-hardening
