name: Apply v1.1 hardening

on:
  push:
    branches: [fix/v1.1-hardening-polish]
    paths:
      - tools/apply_v1_1_hardening.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-hardening-polish
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic hardening when needed
        run: |
          if ! grep -q '__version__ = "1.1.1"' src/version.py 2>/dev/null; then
            python tools/apply_v1_1_hardening.py
          fi
          uv lock
          uv sync --frozen
      - name: Regression gate
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python -m compileall -q src
          node --check src/interface/web/static/arline.js
          git diff --check
      - name: Remove bootstrap and commit result
        run: |
          rm -f tools/apply_v1_1_hardening.py
          rm -f .github/workflows/apply-v1-1-hardening.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: apply verified Arline Studio v1.1.1 hardening"
            git push origin HEAD:fix/v1.1-hardening-polish
          fi
