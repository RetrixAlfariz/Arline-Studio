name: v1.2.0 correctness hardening

on:
  push:
    branches:
      - develop/v1.2
    paths:
      - tools/v120_correctness_hardening.py
      - .github/workflows/v120-correctness-hardening.yml

permissions:
  contents: write

concurrency:
  group: v120-correctness-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply correctness hardening
        run: python tools/v120_correctness_hardening.py
      - name: Install
        run: python -m pip install -e .
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/memory_runtime_smoke.js
      - name: Memory frontend runtime smoke
        run: node tests/frontend/memory_runtime_smoke.js
      - name: Correctness source contract
        run: |
          ! grep -q 'window\.state' src/interface/web/static/js/memory.js
          grep -q 'ArlineRuntime' src/interface/web/static/arline.js
          grep -q 'MEMORY_SCHEMA_VERSION = 2' src/memory/store.py
          grep -q 'replace_source_revision' src/memory/store.py
          grep -q 'session_cutoff' src/memory/scope.py
          grep -q 'source_recorded_at' src/memory/store.py
          grep -q 'max_pack_tokens' src/memory/config.py
          grep -q '_fit_token_budget' src/memory/query.py
          grep -q 'Required structured evidence' src/memory/query.py
          git diff --check
      - name: Clean generated artifacts
        run: |
          rm -rf src/arline_studio.egg-info
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) -delete
      - name: Commit verified source only
        run: |
          git config user.name "Rafzan"
          git config user.email "86295808+RetrixAlfariz@users.noreply.github.com"
          git add \
            src/interface/web/static/arline.js \
            src/interface/web/static/js/memory.js \
            src/interface/web/app.py \
            src/memory \
            config/arline.toml \
            tests/frontend/memory_runtime_smoke.js \
            tests/memory/test_v120_correctness_hardening.py \
            docs/V12_IMPLEMENTATION_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden v1.2.0 memory correctness boundaries"
          git push origin HEAD:develop/v1.2
