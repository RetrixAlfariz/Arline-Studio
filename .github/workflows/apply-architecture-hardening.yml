name: Apply architecture hardening

on:
  push:
    branches: [fix/architecture-hardening]
    paths:
      - tools/apply_architecture_hardening.py
      - .github/workflows/apply-architecture-hardening.yml
  pull_request:
    branches: [develop/v1.2]
    paths:
      - tools/apply_architecture_hardening.py
      - .github/workflows/apply-architecture-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event_name == 'push' || github.head_ref == 'fix/architecture-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/architecture-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply deterministic hardening
        run: python tools/apply_architecture_hardening.py
      - name: Refresh lock and install
        run: |
          uv lock
          uv sync --frozen
      - name: Compile and syntax gate
        run: |
          uv run python -m compileall -q src
          node --check src/interface/web/static/arline.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/compat.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          git diff --check
      - name: Commit hardened tree
        run: |
          rm -f tools/apply_architecture_hardening.py
          rm -f .github/workflows/apply-architecture-hardening.yml
          git config user.name "Aestem"
          git config user.email "aestem@users.noreply.github.com"
          git add -A
          git commit -m "refactor: harden Arline integration architecture"
          git push origin HEAD:fix/architecture-hardening
