name: Export v1.2 source

on:
  push:
    branches:
      - "develop/v1.2"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          zip -qr arline-v12-source.zip . -x '.git/*' 'arline-v12-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: arline-v12-source
          path: arline-v12-source.zip
          retention-days: 1
