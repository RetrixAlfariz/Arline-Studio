name: v1.2.3 Context Intelligence Completion

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/v123_topdown_apply.py'
      - '.github/workflows/v123-topdown-completion.yml'

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply top-down context intelligence
        run: python .github/v123_topdown_apply.py
      - name: Validate v1.2.3
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv
          uv lock --check
          uv sync --frozen
          uv run python -m unittest tests.test_v122_continuity_foundation tests.test_v122_topdown_completion tests.test_v123_context_intelligence -v
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
      - name: Publish clean v1.2.3 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v123_topdown_apply.py .github/workflows/v123-topdown-completion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete v1.2.3 narrative context intelligence'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
