name: Apply v1.1 last mile

on:
  push:
    branches:
      - release/v1.1-final-polish

permissions:
  contents: write

jobs:
  lastmile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1-final-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align one-shot patch with current Library markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_v11_lastmile.py')
          s=p.read_text(encoding='utf-8')
          old='''html=once(html,'          <div id="worldTagFilters" class="tag-list compact"></div>\\n        </div>\\n        <div id="worldGrid"', '          <div id="worldTagFilters" class="tag-list compact"></div>\\n          <div id="worldBulkBar" class="world-bulk-bar hidden"><b id="worldBulkCount">0 selected</b><button id="bulkMoveBtn" class="tiny-btn">Move</button><button id="bulkCollectionBtn" class="tiny-btn">Collection</button><button id="bulkArchiveBtn" class="tiny-btn">Archive</button><button id="bulkClearBtn" class="tiny-btn">Clear</button></div>\\n        </div>\\n        <div id="worldGrid"','world bulk toolbar')'''
          new='''html=once(html,'                  <div id="worldTagFilters" class="inline-tags"></div>\\n                </div>\\n                <div id="worldGrid"', '                  <div id="worldTagFilters" class="inline-tags"></div>\\n                  <div id="worldBulkBar" class="world-bulk-bar hidden"><b id="worldBulkCount">0 selected</b><button id="bulkMoveBtn" class="tiny-btn">Move</button><button id="bulkCollectionBtn" class="tiny-btn">Collection</button><button id="bulkArchiveBtn" class="tiny-btn">Archive</button><button id="bulkClearBtn" class="tiny-btn">Clear</button></div>\\n                </div>\\n                <div id="worldGrid"','world bulk toolbar')'''
          if old not in s:
              raise SystemExit('old bulk anchor block not found in patcher')
          s=s.replace(old,new,1)
          old2='''js=once(js,'  byId(\\"worldEmpty\\").classList.toggle(\\"hidden\\",cards.length>0);','  byId(\\"worldEmpty\\").classList.toggle(\\"hidden\\",cards.length>0); updateWorldBulkBar();','bulk rerender')'''
          new2='''js=once(js,'  byId(\\"worldEmpty\\")?.classList.toggle(\\"hidden\\", cards.length > 0);','  byId(\\"worldEmpty\\")?.classList.toggle(\\"hidden\\", cards.length > 0); updateWorldBulkBar();','bulk rerender')'''
          if old2 not in s:
              raise SystemExit('old bulk rerender anchor not found in patcher')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Apply last-mile patch
        run: python tools/apply_v11_lastmile.py
      - name: Install
        run: python -m pip install -e .
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile and syntax
        run: |
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/arline.js
      - name: Static invariants
        run: |
          test ! -e tools/apply_v11_lastmile.py
          python - <<'PY'
          from pathlib import Path
          js=Path('src/interface/web/static/arline.js').read_text(encoding='utf-8')
          assert 'composerDraftKey' in js
          assert 'openEntityMergeForm' in js
          assert 'bulkMoveSelected' in js
          print('LAST_MILE_STATIC_PASS')
          PY
      - name: Remove generated metadata
        run: rm -rf src/arline_studio.egg-info
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/store.py src/workspace/foundation.py src/interface/web/app.py src/interface/web/static/index.html src/interface/web/static/arline.css src/interface/web/static/arline.js tests/test_v11_lastmile.py tools/apply_v11_lastmile.py
          git diff --cached --stat
          git commit -m 'feat: complete v1.1 identity organization and chat polish'
          git push origin HEAD:release/v1.1-final-polish
