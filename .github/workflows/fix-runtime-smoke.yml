name: Patch runtime smoke failure

on:
  push:
    branches:
      - fix/v1.1-hardening-polish

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-hardening-polish
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import workspace schema version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/interface/web/app.py')
          s = p.read_text(encoding='utf-8')
          anchor = 'from src.storage_backup import backup_sqlite_before_migrations\n'
          addition = 'from src.workspace.store import WORKSPACE_SCHEMA_VERSION\n'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('storage backup import anchor not found')
              s = s.replace(anchor, anchor + addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e .
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - name: Static gates
        run: |
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/arline.js
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/interface/web/app.py
          git commit -m 'fix: import workspace schema version during app bootstrap'
          git push origin HEAD:fix/v1.1-hardening-polish
