name: Apply v1.2.5 Scroll Runtime

on:
  push:
    branches: [develop/v1.2]
    paths:
      - 'scripts/apply_v125_scroll_rework.py'
      - '.github/workflows/apply-scroll-rework.yml'
      - 'src/interface/web/static/js/core/events.js'
      - 'src/interface/web/static/js/chat/**'
      - 'src/interface/web/static/chat-runtime-v125.css'
      - 'tests/test_v125_scroll_runtime.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic integration patch
        run: |
          python scripts/apply_v125_scroll_rework.py
          git checkout -- .github/workflows/ci.yml
      - name: Verify patch hygiene
        run: |
          git diff --check
          python -m py_compile scripts/apply_v125_scroll_rework.py
      - name: Commit integrated runtime
        run: |
          if git diff --quiet; then
            echo 'Scroll runtime is already integrated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .
          git commit -m 'feat(frontend): install stateful chat viewport runtime'
          git push origin HEAD:develop/v1.2
