name: Apply v1.2.1 bulk update

on:
  push:
    branches:
      - "develop/v1.2"
    paths:
      - ".github/workflows/apply-next.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - name: Reconstruct and apply v1.2.1 patch
        run: |
          cat tools/apply_next.part00 tools/apply_next.part01 tools/apply_next.part02 tools/apply_next.part03 tools/apply_next.part04 \
            | base64 -d | gzip -d > /tmp/apply_next.py
          python -m py_compile /tmp/apply_next.py
          python /tmp/apply_next.py
      - name: Commit feature update
        run: |
          git config user.name "Rafzan"
          git config user.email "86295808+RetrixAlfariz@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && { echo "Applicator produced no changes" >&2; exit 1; }
          git commit -m "feat: start v1.2.1 temporal memory and Character Rails"
          git push origin HEAD:develop/v1.2

# permanent CI validates the generated feature commit
