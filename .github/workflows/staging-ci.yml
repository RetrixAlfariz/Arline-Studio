name: v1.2.5 Staging Validation
# Final staging pass for the v1.2.5 command, native storage, and brand reform.

on:
  push:
    branches: [tmp-v125-write]
    paths-ignore:
      - '.github/V125_STAGING_RESULT'
      - '.github/V125_STAGING_LOG'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Prepare v1.2.5 generated wiring
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/interface/web/static/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('content="#202220"', 'content="#1E2120"')
          text = text.replace('Studio v1.2 α', 'Studio v1.2.5 α')
          text = text.replace('?v=1.2.4-directives', '?v=1.2.5-brand')
          base = '<link rel="stylesheet" href="/static/arline.css?v=1.2.5-brand" />'
          brand = '<link rel="stylesheet" href="/static/brand-v125.css?v=1.2.5-brand" />'
          icon = '<link rel="icon" type="image/svg+xml" href="/static/assets/brand/arline-primary.svg" />'
          if brand not in text:
              if base not in text:
                  raise SystemExit('Base stylesheet link not found; refusing blind brand injection')
              text = text.replace(base, base + '\n  ' + brand + '\n  ' + icon, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv lock
          git add -- src/interface/web/static/index.html uv.lock
          if git diff --cached --quiet; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize v1.2.5 brand and lock wiring'
          git push origin HEAD:tmp-v125-write
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Verify complete v1.2.5 staging contract
        if: steps.prep.outputs.updated != 'true'
        shell: bash
        run: |
          set +e
          : > /tmp/v125.log
          result=success

          run_step() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a /tmp/v125.log
            "$@" >>/tmp/v125.log 2>&1
            code=$?
            echo "exit=$code" >>/tmp/v125.log
            echo >>/tmp/v125.log
            if [ $code -ne 0 ]; then result=failure; fi
            return 0
          }

          run_step "uv lock check" uv lock --check
          run_step "uv sync frozen" uv sync --frozen
          run_step "python regression" uv run python -m unittest discover -s tests -v
          run_step "python compile" uv run python -m compileall -q src tests
          run_step "commands syntax" node --check src/interface/web/static/js/commands.js
          run_step "command center syntax" node --check src/interface/web/static/js/command-center.js
          run_step "stream syntax" node --check src/interface/web/static/js/stream.js
          run_step "quick create syntax" node --check src/interface/web/static/js/quick-create.js
          run_step "discovery sheets syntax" node --check src/interface/web/static/js/discovery-sheets.js
          run_step "memory syntax" node --check src/interface/web/static/js/memory.js
          run_step "main frontend syntax" node --check src/interface/web/static/arline.js
          run_step "browser smoke syntax" node --check tests/frontend/browser_smoke.mjs
          run_step "memory runtime smoke" node tests/frontend/memory_runtime_smoke.js

          run_step "build native wheel" uvx --from "maturin>=1.8,<2" maturin build --release --manifest-path crates/arline-native/Cargo.toml --out /tmp/native-wheel
          if [ "$result" = success ]; then
            run_step "install native wheel" uv pip install --python .venv/bin/python /tmp/native-wheel/*.whl
          fi

          if [ "$result" = success ]; then
            echo "===== strict rust smoke =====" >>/tmp/v125.log
            ARLINE_STORAGE_BACKEND=rust uv run python - <<'PY' >>/tmp/v125.log 2>&1
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import _arline_native
          from src.storage.backend import BlobStore

          assert _arline_native.storage_version() == "0.1.0"
          with TemporaryDirectory() as td:
              store = BlobStore(Path(td) / "objects", backend="rust")
              payload = b"arline-staging-native"
              first = store.put_bytes(payload)
              second = store.put_bytes(payload)
              assert first.digest == sha256(payload).hexdigest()
              assert first.backend == "rust"
              assert first.path == second.path
              assert first.created is True
              assert second.created is False
              assert store.read_bytes(first.digest) == payload
          print("strict Rust storage backend: ok")
          PY
            code=$?
            echo "exit=$code" >>/tmp/v125.log
            echo >>/tmp/v125.log
            if [ $code -ne 0 ]; then result=failure; fi
          fi

          if [ "$result" = success ]; then
            run_step "install playwright" npm install --no-save playwright@1.55.0
            run_step "install chromium" npx playwright install --with-deps chromium
          fi

          if [ "$result" = success ]; then
            echo "===== prepare browser config =====" >>/tmp/v125.log
            uv run python - <<'PY' >>/tmp/v125.log 2>&1
          from pathlib import Path
          import tomlkit

          root = Path.cwd()
          runtime = Path('/tmp/arline-v125-staging')
          runtime.mkdir(parents=True, exist_ok=True)
          doc = tomlkit.parse((root / 'config/arline.toml').read_text(encoding='utf-8'))
          doc['lmstudio']['auto_load'] = False
          doc['lmstudio']['api_key'] = ''
          doc['writer']['system_prompt_file'] = (root / 'config/writer_system.txt').as_posix()
          doc['reasoning_runtime']['guard_prompt_file'] = (root / 'config/reasoning_guard.txt').as_posix()
          doc['history']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['history']['dataset_root'] = (runtime / 'datasets').as_posix()
          doc['workspace']['database_path'] = (runtime / 'arline.db').as_posix()
          doc['artifacts']['output_root'] = (runtime / 'output').as_posix()
          doc['artifacts']['saved_root'] = (runtime / 'saved').as_posix()
          doc['ui']['host'] = '127.0.0.1'
          doc['ui']['port'] = 7860
          Path('/tmp/arline-v125-staging.toml').write_text(tomlkit.dumps(doc), encoding='utf-8')
          PY
            code=$?
            echo "exit=$code" >>/tmp/v125.log
            echo >>/tmp/v125.log
            if [ $code -ne 0 ]; then result=failure; fi
          fi

          server_pid=""
          if [ "$result" = success ]; then
            echo "===== chromium browser smoke =====" >>/tmp/v125.log
            uv run python app.py --config /tmp/arline-v125-staging.toml >/tmp/arline-v125-server.log 2>&1 &
            server_pid=$!
            ready=false
            for attempt in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:7860/api/config >/dev/null 2>&1; then
                ready=true
                break
              fi
              sleep 0.5
            done
            if [ "$ready" != true ]; then
              echo "Studio failed to start" >>/tmp/v125.log
              result=failure
            else
              ARLINE_BROWSER_URL=http://127.0.0.1:7860 node tests/frontend/browser_smoke.mjs >>/tmp/v125.log 2>&1
              code=$?
              echo "exit=$code" >>/tmp/v125.log
              if [ $code -ne 0 ]; then result=failure; fi
            fi
            cat /tmp/arline-v125-server.log >>/tmp/v125.log 2>/dev/null || true
          fi
          if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi

          printf 'result=%s\ntested_sha=%s\n' "$result" "$GITHUB_SHA" > .github/V125_STAGING_RESULT
          cp /tmp/v125.log .github/V125_STAGING_LOG
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/V125_STAGING_RESULT .github/V125_STAGING_LOG
          git commit -m 'chore: record v1.2.5 staging verification [skip ci]' || true
          git push origin HEAD:tmp-v125-write
          test "$result" = success
