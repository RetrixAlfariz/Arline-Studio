name: v1.2.5 Staging Validation

on:
  push:
    branches: [tmp-v125-write]
    paths-ignore:
      - '.github/V125_STAGING_RESULT'

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Full Python regression
        run: uv run python -m unittest discover -s tests -v
      - name: Compile and frontend syntax
        run: |
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/command-center.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node tests/frontend/memory_runtime_smoke.js
          git diff --check

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native core wheel
        run: |
          python -m pip install "maturin>=1.8,<2"
          maturin build --release --manifest-path crates/arline-native/Cargo.toml --out /tmp/native-wheel
          python -m pip install /tmp/native-wheel/*.whl
      - name: Exercise strict Rust backend
        env:
          ARLINE_STORAGE_BACKEND: rust
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import _arline_native
          from src.storage.backend import BlobStore

          assert _arline_native.storage_version() == "0.1.0"
          with TemporaryDirectory() as td:
              store = BlobStore(Path(td) / "objects", backend="rust")
              payload = b"arline-staging-native"
              a = store.put_bytes(payload)
              b = store.put_bytes(payload)
              assert a.digest == sha256(payload).hexdigest()
              assert a.backend == "rust"
              assert a.path == b.path
              assert a.created and not b.created
              assert store.read_bytes(a.digest) == payload
          print("strict Rust storage backend: ok")
          PY

  report:
    if: always()
    needs: [python, native]
    runs-on: ubuntu-latest
    env:
      PYTHON_RESULT: ${{ needs.python.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v125-write
          fetch-depth: 0
      - name: Record staging result
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PYTHON_RESULT" = success ] && [ "$NATIVE_RESULT" = success ]; then
            result=success
          else
            result=failure
          fi
          cat > .github/V125_STAGING_RESULT <<EOF
          result=$result
          python=$PYTHON_RESULT
          native=$NATIVE_RESULT
          tested_sha=$GITHUB_SHA
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/V125_STAGING_RESULT
          git commit -m 'chore: record v1.2.5 staging result [skip ci]' || exit 0
          git push origin HEAD:tmp-v125-write
