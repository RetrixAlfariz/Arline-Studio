name: v1.2.5 Staging Validation

on:
  push:
    branches: [tmp-v125-write]
    paths-ignore:
      - '.github/V125_STAGING_RESULT'
      - '.github/V125_STAGING_LOG'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Python, frontend, and native core
        shell: bash
        run: |
          set +e
          : > /tmp/v125.log
          run_step() {
            echo "===== $1 =====" | tee -a /tmp/v125.log
            shift
            "$@" >>/tmp/v125.log 2>&1
            code=$?
            echo "exit=$code" >>/tmp/v125.log
            echo >>/tmp/v125.log
            return $code
          }
          result=success
          run_step "uv lock check" uv lock --check || result=failure
          run_step "uv sync frozen" uv sync --frozen || result=failure
          run_step "python regression" uv run python -m unittest discover -s tests -v || result=failure
          run_step "python compile" uv run python -m compileall -q src tests || result=failure
          run_step "command center syntax" node --check src/interface/web/static/js/command-center.js || result=failure
          run_step "commands syntax" node --check src/interface/web/static/js/commands.js || result=failure
          run_step "stream syntax" node --check src/interface/web/static/js/stream.js || result=failure
          run_step "quick create syntax" node --check src/interface/web/static/js/quick-create.js || result=failure
          run_step "main frontend syntax" node --check src/interface/web/static/arline.js || result=failure
          run_step "memory runtime smoke" node tests/frontend/memory_runtime_smoke.js || result=failure
          run_step "install maturin" uv run python -m pip install "maturin>=1.8,<2" || result=failure
          run_step "build native wheel" uv run maturin build --release --manifest-path crates/arline-native/Cargo.toml --out /tmp/native-wheel || result=failure
          if [ "$result" = success ]; then
            run_step "install native wheel" uv pip install --python .venv/bin/python /tmp/native-wheel/*.whl || result=failure
          fi
          if [ "$result" = success ]; then
            ARLINE_STORAGE_BACKEND=rust uv run python - <<'PY' >>/tmp/v125.log 2>&1
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import _arline_native
          from src.storage.backend import BlobStore

          assert _arline_native.storage_version() == "0.1.0"
          with TemporaryDirectory() as td:
              store = BlobStore(Path(td) / "objects", backend="rust")
              payload = b"arline-staging-native"
              a = store.put_bytes(payload)
              b = store.put_bytes(payload)
              assert a.digest == sha256(payload).hexdigest()
              assert a.backend == "rust"
              assert a.path == b.path
              assert a.created and not b.created
              assert store.read_bytes(a.digest) == payload
          print("strict Rust storage backend: ok")
          PY
            [ $? -eq 0 ] || result=failure
          fi
          printf 'result=%s\ntested_sha=%s\n' "$result" "$GITHUB_SHA" > .github/V125_STAGING_RESULT
          cp /tmp/v125.log .github/V125_STAGING_LOG
          git config user.name 'github-actions[bot]'
          git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
          git add -- .github/V125_STAGING_RESULT .github/V125_STAGING_LOG
          git commit -m 'chore: record v1.2.5 staging verification [skip ci]' || true
          git push origin HEAD:tmp-v125-write
          test "$result" = success
