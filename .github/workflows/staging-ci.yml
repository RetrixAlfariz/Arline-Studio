name: v1.2.5 Staging Validation

on:
  push:
    branches: [tmp-v125-write]
    paths-ignore:
      - '.github/V125_STAGING_RESULT'
      - '.github/V125_STAGING_LOG'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate and capture diagnostics
        id: validate
        shell: bash
        run: |
          set +e
          log=.github/V125_STAGING_LOG
          : > "$log"
          overall=0
          run_check() {
            label="$1"; shift
            echo "===== $label =====" | tee -a "$log"
            "$@" >>"$log" 2>&1
            code=$?
            echo "exit=$code" | tee -a "$log"
            echo >>"$log"
            if [ $code -ne 0 ]; then overall=1; fi
            return 0
          }

          run_check "uv sync frozen" uv sync --frozen
          run_check "python regression" uv run python -m unittest discover -s tests -v
          run_check "python compile" uv run python -m compileall -q src tests
          for file in \
            src/interface/web/static/js/commands.js \
            src/interface/web/static/js/command-center.js \
            src/interface/web/static/js/stream.js \
            src/interface/web/static/js/quick-create.js \
            src/interface/web/static/js/memory.js \
            src/interface/web/static/js/discovery-sheets.js \
            src/interface/web/static/arline.js; do
            run_check "node check $file" node --check "$file"
          done
          run_check "memory runtime smoke" node tests/frontend/memory_runtime_smoke.js
          run_check "git diff check" git diff --check
          run_check "install maturin" python -m pip install "maturin>=1.8,<2"
          run_check "build native wheel" maturin build --release --manifest-path crates/arline-native/Cargo.toml --out /tmp/native-wheel
          if ls /tmp/native-wheel/*.whl >/dev/null 2>&1; then
            run_check "install native wheel" uv pip install /tmp/native-wheel/*.whl
            echo "===== strict rust smoke =====" | tee -a "$log"
            ARLINE_STORAGE_BACKEND=rust uv run python - <<'PY' >>"$log" 2>&1
          from hashlib import sha256
          from pathlib import Path
          from tempfile import TemporaryDirectory
          import _arline_native
          from src.storage.backend import BlobStore

          assert _arline_native.storage_version() == "0.1.0"
          with TemporaryDirectory() as td:
              store = BlobStore(Path(td) / "objects", backend="rust")
              payload = b"arline-staging-native"
              a = store.put_bytes(payload)
              b = store.put_bytes(payload)
              assert a.digest == sha256(payload).hexdigest()
              assert a.backend == "rust"
              assert a.path == b.path
              assert a.created and not b.created
              assert store.read_bytes(a.digest) == payload
          print("strict Rust storage backend: ok")
          PY
            code=$?
            echo "exit=$code" | tee -a "$log"
            if [ $code -ne 0 ]; then overall=1; fi
          else
            echo "native wheel was not produced" | tee -a "$log"
            overall=1
          fi

          if [ $overall -eq 0 ]; then result=success; else result=failure; fi
          cat > .github/V125_STAGING_RESULT <<EOF
          result=$result
          tested_sha=$GITHUB_SHA
          EOF
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish staging result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898208+github-actions[bot]@users.noreply.github.com'
          git add -- .github/V125_STAGING_RESULT .github/V125_STAGING_LOG
          git commit -m 'chore: record v1.2.5 staging diagnostics [skip ci]' || exit 0
          git push origin HEAD:tmp-v125-write
      - name: Fail workflow when validation failed
        if: steps.validate.outputs.result != 'success'
        run: exit 1
