name: Apply v1.1 hardening

on:
  push:
    branches:
      - fix/v1.1-hardening-polish
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-hardening-polish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make one-shot parser regex-safe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('tools/apply_v11_hardening.py')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r'^  const boundary = \(ch\) => .*?;$',
              r'''  const boundary = (ch) => !ch || /\s/.test(ch) || ".,;:!?()[]{}<>/\\\\|+=*~—–-".includes(ch) || ch === '"' || ch === "'" || ch === "\\x60";''',
              s,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit(f'boundary patch count={n}')
          old = r'''        const match = text.slice(after).match(/^[^\s@,;:()\[\]{}]+/);
                  if (!match) { i += 1; continue; }
                  end = after + match[0].length;
                  found.push({ type: "unresolved", id: `unresolved:${match[0]}`, label: match[0], resolved: false });'''
          new = r'''        end = after;
                  while (end < text.length && text[end] !== "@" && !boundary(text[end])) end += 1;
                  if (end === after) { i += 1; continue; }
                  const unresolved = text.slice(after, end);
                  found.push({ type: "unresolved", id: `unresolved:${unresolved}`, label: unresolved, resolved: false });'''
          if old not in s:
              raise SystemExit('unresolved-token block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply audited fixes
        run: python tools/apply_v11_hardening.py
      - name: Install package
        run: python -m pip install -e .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check JavaScript
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/arline.js
      - name: Ensure migration helper removed
        run: |
          test ! -e tools/apply_v11_hardening.py
          test ! -e .github/workflows/apply-hardening.yml
      - name: Commit hardened source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: harden v1.1 architecture and polish composer'
          git push origin HEAD:fix/v1.1-hardening-polish
