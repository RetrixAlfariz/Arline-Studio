name: Apply v1.1 hardening

on:
  push:
    branches:
      - fix/v1.1-hardening-polish

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply audited fixes
        run: python tools/apply_v11_hardening.py
      - name: Install package
        run: python -m pip install -e .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check JavaScript
        run: |
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/arline.js
      - name: Ensure migration helper removed
        run: |
          test ! -e tools/apply_v11_hardening.py
          test ! -e .github/workflows/apply-hardening.yml
      - name: Commit hardened source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix: harden v1.1 architecture and polish composer'
          git push
