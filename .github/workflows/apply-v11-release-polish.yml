name: Apply v1.1 release polish

on:
  push:
    branches:
      - fix/v1.1-settings-stack

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1-settings-stack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final v1.1 release polish
        run: python tools/apply_v11_release_polish.py

      - name: Install
        run: python -m pip install -e .

      - name: Regression suite
        run: python -m unittest discover -s tests -v

      - name: Compile and JavaScript syntax
        run: |
          python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/arline.js

      - name: Release-polish invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('src/interface/web/static/index.html').read_text(encoding='utf-8')
          css=Path('src/interface/web/static/arline.css').read_text(encoding='utf-8')
          js=Path('src/interface/web/static/arline.js').read_text(encoding='utf-8')
          assert 'body.chat-session-active' in css
          assert 'id="welcomeDialog"' in html
          assert 'id="startupRecovery"' in html
          assert 'id="runDataDoctorBtn"' in html
          assert 'conversationRenderLimit' in js
          assert 'data: () => setView("data")' not in js
          assert 'data-home-view="data"' not in js
          assert 'arline.css?v=1.1.2-polish' in html
          print('V11_RELEASE_POLISH_STATIC_PASS')
          PY

      - name: Remove generated and one-shot files
        run: |
          rm -rf src/arline_studio.egg-info
          rm -f tools/apply_v11_release_polish.py
          rm -f .github/workflows/apply-v11-release-polish.yml

      - name: Commit release polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'polish: finalize adaptive chat and v1.1 recovery UX'
          git push origin HEAD:fix/v1.1-settings-stack
