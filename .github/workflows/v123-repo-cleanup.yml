name: v1.2.3 Repository Cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/v123-repo-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop/v1.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Remove browser harness residue and refresh asset cache key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          python - <<'PY'
          from pathlib import Path

          ignore = Path('.gitignore')
          text = ignore.read_text(encoding='utf-8')
          if 'node_modules/' not in text.splitlines():
              if not text.endswith('\n'):
                  text += '\n'
              text += 'node_modules/\n'
              ignore.write_text(text, encoding='utf-8')

          index = Path('src/interface/web/static/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('?v=1.2.2-hardening', '?v=1.2.3-context')
          index.write_text(html, encoding='utf-8')

          for test in Path('tests').rglob('test_*.py'):
              body = test.read_text(encoding='utf-8')
              updated = body.replace('?v=1.2.2-hardening', '?v=1.2.3-context')
              if updated != body:
                  test.write_text(updated, encoding='utf-8')
          PY
          test ! -d node_modules
      - uses: astral-sh/setup-uv@v6
      - name: Validate clean v1.2.3 tree
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen
          uv run python -m unittest tests.test_v122_continuity_foundation tests.test_v122_topdown_completion tests.test_v123_context_intelligence -v
          uv run python -m unittest discover -s tests -p 'test_*.py'
          uv run python -m compileall -q src tests
          node --check src/interface/web/static/js/commands.js
          node --check src/interface/web/static/js/stream.js
          node --check src/interface/web/static/js/quick-create.js
          node --check src/interface/web/static/js/memory.js
          node --check src/interface/web/static/js/discovery-sheets.js
          node --check src/interface/web/static/arline.js
          node --check tests/frontend/browser_smoke.mjs
          git diff --check
          test ! -d node_modules
      - name: Publish clean repository state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v123-repo-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git ls-files --cached 'node_modules/**' | grep -q .; then
            echo 'Refusing to commit while node_modules is tracked' >&2
            exit 1
          fi
          git commit -m 'chore: clean v1.2.3 browser harness residue'
          git fetch origin develop/v1.2
          git rebase origin/develop/v1.2
          git push origin HEAD:develop/v1.2
