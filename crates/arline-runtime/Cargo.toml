[package]
name = "arline-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Python-free local runtime and desktop host for Arline Studio"
license = "MIT"
publish = false

[lib]
name = "arline_runtime"
path = "src/lib.rs"

[[bin]]
name = "arline"
path = "src/main.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = { version = "0.8.9", features = ["json", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
async-stream = "0.3"
futures-util = "0.3"
clap = { version = "4.6", features = ["derive"] }
url = "2"
percent-encoding = "2"
zip = { version = "8.6", default-features = false }
tauri = { version = "2", optional = true, features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
